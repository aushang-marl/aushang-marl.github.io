<style>
:root{--bg:#023e8a;--bg2:#03045e;--ac:#90e0ef;--ink:#ffffff;--text:#1d2433;--muted:#5b6475}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans','Noto Sans Arabic',system-ui,sans-serif;background:#f4f1ea;color:var(--text);line-height:1.5}
[dir=rtl] body{font-family:'Noto Sans Arabic','Noto Sans',system-ui,sans-serif}
.hero{background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);padding:26px 20px 34px;text-align:center}
.emoji{font-size:58px;line-height:1}
h1{margin:10px 0 4px;font-size:29px;font-weight:800}
.sub{margin:0 auto;max-width:520px;opacity:.92}
main{max-width:640px;margin:-18px auto 40px;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.lang{display:block;width:100%;padding:16px 10px;border:0;border-radius:14px;background:#fff;color:var(--text);font:inherit;font-size:20px;font-weight:600;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.lang:hover,.lang:active{background:var(--ac)}
.top{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;padding:8px 12px;background:var(--bg2)}
.top button{border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.listen{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:18px;margin:0 0 14px;border:0;border-radius:16px;background:var(--ac);color:#111;font:inherit;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.listen:focus-visible,.lang:focus-visible{outline:4px solid #000;outline-offset:2px}
.item{background:#fff;border-radius:16px;padding:16px 18px;margin:0 0 12px;box-shadow:0 4px 18px rgba(0,0,0,.07);border-inline-start:6px solid #c9ced8}
.item.event{border-inline-start-color:var(--bg)}
.item.playing{outline:3px solid var(--ac)}
.item h2{margin:0;font-size:20px;display:flex;gap:10px;align-items:flex-start}
.item .when{font-weight:700;color:var(--bg);margin:6px 0 2px}
.item .where{color:var(--muted);font-size:15px;margin:0 0 6px}
.item p{margin:6px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:#eef1f6;color:#33405a}
.tag.free{background:#d8f3dc;color:#1b4332}
.tag.now{background:#ffe8a3;color:#5c4400}
.none{background:#fff;border-radius:16px;padding:20px;text-align:center}
.hidden{display:none}
footer{text-align:center;color:var(--muted);font-size:13px;padding-bottom:30px}
</style></head>

embe 12–21, Cuma ve Cumartesi 12–22."], "sq": ["Tregu i Krishtlindjeve në Recklinghausen", "Treg i madh i Krishtlindjeve në tre sheshe në qytetin e vjetër. E diel deri të enjte 12–21, e premte dhe e shtunë 12–22."], "ru": ["Рождественская ярмарка в Реклингхаузене", "Большая рождественская ярмарка на трёх площадях старого города. С воскресенья по четверг 12–21, в пятницу и субботу 12–22."], "fa": ["بازار کریسمس رکلینگهاوزن", "بازار بزرگ کریسمس در سه میدان شهر قدیمی. یکشنبه تا پنجشنبه ۱۲ تا ۲۱، جمعه و شنبه ۱۲ تا ۲۲."], "zh": ["雷克林豪森圣诞市场", "老城区三个广场上的大型圣诞市场。周日至周四12–21点，周五和周六12–22点。"]}}, {"id": "totensonntag-2026", "kind": "day", "free": null, "emoji": "🕯️", "ranges": [["2026-11-22", "2026-11-22"]], "place": null, "t": {"de": ["Totensonntag", "Christlicher Gedenktag für die Verstorbenen. Ein stiller Tag: keine lauten Feiern, viele Menschen besuchen Friedhöfe."], "ar": ["أحد الموتى", "يوم مسيحي لذكرى الموتى. يوم هادئ: لا احتفالات صاخبة، والكثيرون يزورون المقابر."], "en": ["Sunday of the Dead (Totensonntag)", "Christian day to remember the dead. A quiet day: no loud parties, many people visit cemeteries."], "fr": ["Dimanche des morts (Totensonntag)", "Jour chrétien de souvenir des défunts. Un jour calme : pas de fêtes bruyantes, beaucoup de gens vont au cimetière."], "ku": ["Yekşema Miriyan (Totensonntag)", "Roja bîranîna miriyan a xiristiyanan. Rojeke bêdeng e: şahiyên bi deng tune ne, gelek kes diçin goristanan."], "tr": ["Ölüleri Anma Pazarı (Totensonntag)", "Hristiyanların ölüleri andığı gün. Sessiz bir gün: gürültülü kutlama yapılmaz, birçok kişi mezarlığı ziyaret eder."], "sq": ["E diela e të vdekurve (Totensonntag)", "Ditë e krishterë e përkujtimit të të vdekurve. Ditë e qetë: pa festa të zhurmshme, shumë njerëz vizitojnë varrezat."], "ru": ["Воскресенье мёртвых (Totensonntag)", "Христианский день памяти умерших. Тихий день: никаких шумных праздников, многие посещают кладбища."], "fa": ["یکشنبه مردگان (Totensonntag)", "روز مسیحی یادبود درگذشتگان. روزی آرام: جشن پرسروصدا برگزار نمی‌شود و بسیاری به گورستان می‌روند."], "zh": ["亡者主日（Totensonntag）", "基督教纪念逝者的日子。这是安静的一天：不举行喧闹的聚会，很多人去墓地。"]}}, {"id": "weihnachtsmarkt-alt-marl-2026", "kind": "event", "free": true, "emoji": "🎄", "ranges": [["2026-11-28", "2026-11-29"]], "place": "Rund um St. Georg, Alt-Marl", "t": {"de": ["Weihnachtsmarkt Alt-Marl", "Samstag ab 15 Uhr, Sonntag 12–18 Uhr. Samstag um 17 Uhr kommt der Nikolaus, mit Laternenumzug für Kinder."], "ar": ["سوق عيد الميلاد في ألت-مارل", "السبت من الساعة 15، الأحد 12–18. يوم السبت الساعة 17 يأتي القديس نيكولاوس مع موكب فوانيس للأطفال."], "en": ["Christmas market Alt-Marl", "Saturday from 3 pm, Sunday 12–6 pm. On Saturday at 5 pm St Nicholas comes, with a lantern walk for children."], "fr": ["Marché de Noël d'Alt-Marl", "Samedi dès 15h, dimanche 12h–18h. Samedi à 17h, saint Nicolas arrive, avec un défilé de lanternes pour les enfants."], "ku": ["Bazara Noelê ya Alt-Marl", "Şemî ji saet 15an, Yekşem 12–18. Şemiyê saet 17an Nîkolaus tê, bi meşa fenerên ji bo zarokan."], "tr": ["Alt-Marl Noel Pazarı", "Cumartesi 15'ten itibaren, Pazar 12–18. Cumartesi saat 17'de Aziz Nikolaus geliyor, çocuklar için fener yürüyüşü var."], "sq": ["Tregu i Krishtlindjeve Alt-Marl", "E shtunë nga ora 15, e diel 12–18. Të shtunën në orën 17 vjen Shën Nikolla, me paradë fenerësh për fëmijët."], "ru": ["Рождественская ярмарка в Альт-Марле", "Суббота с 15:00, воскресенье 12–18. В субботу в 17:00 приходит Николаус, шествие с фонариками для детей."], "fa": ["بازار کریسمس آلت-مارل", "شنبه از ساعت ۱۵، یکشنبه ۱۲ تا ۱۸. شنبه ساعت ۱۷ نیکولاس می‌آید، با راهپیمایی فانوس برای کودکان."], "zh": ["老马尔圣诞市场", "周六15点起，周日12–18点。周六17点圣尼古拉斯到来，并有儿童灯笼游行。"]}}, {"id": "advent1-2026", "kind": "day", "free": null, "emoji": "🕯️", "ranges": [["2026-11-29", "2026-11-29"]], "place": null, "t": {"de": ["1. Advent", "Die Adventszeit beginnt: die vier Wochen vor Weihnachten. Jeden Sonntag wird eine Kerze mehr am Adventskranz angezündet."], "ar": ["الأحد الأول من زمن المجيء", "يبدأ زمن المج "2026-12-20", "2026-12-20"]], "place": null, "t": {"de": ["4. Advent", "Alle vier Kerzen am Adventskranz brennen. Weihnachten ist ganz nah."], "ar": ["الأحد الرابع من المجيء", "الشموع الأربع كلها مضاءة على إكليل المجيء. عيد الميلاد قريب جداً."], "en": ["4th Sunday of Advent", "All four candles on the Advent wreath are burning. Christmas is very close."], "fr": ["4e dimanche de l'Avent", "Les quatre bougies de la couronne de l'Avent brûlent. Noël est tout proche."], "ku": ["Adventa 4em", "Her çar mom li ser taca Adventê dişewitin. Noel pir nêzîk e."], "tr": ["4. Advent", "Advent çelengindeki dört mumun hepsi yanıyor. Noel çok yakın."], "sq": ["E diela e katërt e Adventit", "Të katër qirinjtë e kurorës së Adventit digjen. Krishtlindjet janë shumë afër."], "ru": ["Четвёртое воскресенье Адвента", "Горят все четыре свечи адвентского венка. Рождество совсем близко."], "fa": ["یکشنبه چهارم ادونت", "هر چهار شمع تاج ادونت روشن است. کریسمس خیلی نزدیک است."], "zh": ["将临期第四主日", "将临期花环上的四支蜡烛全部点亮。圣诞节就要到了。"]}}, {"id": "weihnachtsferien-2026", "kind": "day", "free": null, "emoji": "🎒", "ranges": [["2026-12-23", "2027-01-06"]], "place": null, "t": {"de": ["Weihnachtsferien in NRW", "Die Schulen sind geschlossen. Der erste Schultag ist Donnerstag, 7. Januar 2027."], "ar": ["عطلة عيد الميلاد المدرسية في ولاية شمال الراين-وستفاليا", "المدارس مغلقة. أول يوم دراسي هو الخميس 7 كانون الثاني/يناير 2027."], "en": ["Christmas school holidays in NRW", "Schools are closed. The first school day is Thursday, 7 January 2027."], "fr": ["Vacances de Noël en NRW", "Les écoles sont fermées. La rentrée est le jeudi 7 janvier 2027."], "ku": ["Betlaneya Noelê ya dibistanan li NRW", "Dibistan girtî ne. Roja yekem a dibistanê Pêncşem, 7ê Çileya Paşîn 2027 e."], "tr": ["NRW'de Noel okul tatili", "Okullar kapalı. Okulun ilk günü 7 Ocak 2027 Perşembe."], "sq": ["Pushimet e Krishtlindjeve në NRW", "Shkollat janë të mbyllura. Dita e parë e shkollës është e enjte, 7 janar 2027."], "ru": ["Рождественские каникулы в NRW", "Школы закрыты. Первый учебный день — четверг, 7 января 2027 года."], "fa": ["تعطیلات مدارس کریسمس در NRW", "مدارس تعطیل هستند. اولین روز مدرسه پنجشنبه ۷ ژانویه ۲۰۲۷ است."], "zh": ["北威州圣诞学校假期", "学校放假。第一个上学日是2027年1月7日星期四。"]}}, {"id": "heiligabend-2026", "kind": "day", "free": null, "emoji": "⭐", "ranges": [["2026-12-24", "2026-12-24"]], "place": null, "t": {"de": ["Heiligabend", "Der Abend vor Weihnachten, das wichtigste Familienfest. Geschäfte schließen meist schon am Mittag, viele Büros sind zu."], "ar": ["ليلة عيد الميلاد", "المساء الذي يسبق عيد الميلاد، أهم عيد عائلي. المتاجر تغلق غالباً عند الظهر، والكثير من المكاتب مغلقة."], "en": ["Christmas Eve", "The evening before Christmas, the most important family celebration. Shops usually close at midday, many offices are closed."], "fr": ["Réveillon de Noël", "La soirée avant Noël, la fête de famille la plus importante. Les magasins ferment souvent à midi, beaucoup de bureaux sont fermés."], "ku": ["Şeva Noelê", "Êvara berî Noelê, girîngtirîn cejna malbatê. Dikan bi gelemperî nîvro digirin, gelek ofîs girtî ne."], "tr": ["Noel Arifesi", "Noel'den önceki akşam, en önemli aile bayramı. Dükkânlar genellikle öğlen kapanır, birçok ofis kapalıdır."], "sq": ["Nata e Krishtlindjes", "Mbrëmja para Krishtlindjeve, festa më e rëndësishme familjare. Dyqanet zakonisht mbyllen në mesditë, shumë zyra janë të mbyllura."], "ru": ["Сочельник", "Вечер перед Рождеством, главный семейный праздник. Магазины обычно закрываются в полдень, многие учреждения не работают."], "fa": ["شب کریسمس", "شب پیش از کریسمس، مهم‌ترین جشن خانوادگی. مغازه‌ها معمولاً ظهر می‌بندند و بسیاری از ادارات تعطیل هستند."], "zh": ["平安夜", "圣诞节前夜，最重要的家庭节日。商店通常中午就关门，很多办公室不上班。"]}}, {"id": "weihnachten-2026", "kind": "day", "free": null, "emoji": "🎄", "ranges": [["2026-12-25", "2026-12-26"]], "place": null, "t": {"de": ["Weihnachten (1. und 2. Feiertag)", "Gesetzliche Feiertage. Geschäfte, Ämter und viele Arztpraxen sind geschlossen. Im Notfall: 112, ärztlicher Bereitschaftsdienst 116 117."], "ar": ["عيد الميلاد (اليوم الأول والثاني)", "عطلة رسمية. المتاجر والدوائر الحكومية وكثير من العيادات مغلقة. في الطوارئ: 112، خدمة الأطباء المناوبين 116117."], "en": ["Christmas (1st and 2nd day)", "Public holidays. Shops, offices and many doctors' practices are closed. Emergency: 112, on-call doctor 116 117."], "fr": ["Noël (1er et 2e jour)", "Jours fériés. Magasins, administrations et beaucoup de cabinets médicaux sont fermés. Urgence : 112, médecin de garde 116 117."], "ku": ["Noel (roja 1em û 2yem)", "Betlaneyên fermî. Dikan, dezgeh û gelek muayenexane girtî ne. Di rewşa awarte de: 112, doktorê nobetdar 116 117."], "tr": ["Noel (1. ve 2. gün)", "Resmi tatil. Dükkânlar, resmi daireler ve birçok doktor muayenehanesi kapalı. Acil durumda: 112, nöbetçi doktor 116 117."], "sq": ["Krishtlindjet (dita e 1 dhe e 2)", "Festa zyrtare. Dyqanet, zyrat dhe shumë ordinanca mjekësore janë të mbyllura. Urgjenca: 112, mjeku kujdestar 116 117."], "ru": ["Рождество (1-й и 2-й день)", "Официальные праздники. Магазины, учреждения и многие врачебные кабинеты закрыты. Экстренно: 112, дежурный врач 116 117."], "fa": ["کریسمس (روز اول و دوم)", "تعطیل رسمی. مغازه‌ها، ادارات و بسیاری از مطب‌ها بسته‌اند. در مواقع اضطراری: ۱۱۲، پزشک کشیک ۱۱۶۱۱۷."], "zh": ["圣诞节（第一天和第二天）", "法定节假日。商店、政府机关和许多诊所关闭。紧急情况：112，值班医生116 117。"]}}, {"id": "silvester-2026", "kind": "day", "free": null, "emoji": "🎆", "ranges": [["2026-12-31", "2026-12-31"]], "place": null, "t": {"de": ["Silvester", "Der letzte Tag des Jahres. Feuerwerk wird nur vom 29. bis 31.12. verkauft und darf nur an Silvester und Neujahr gezündet werden. Nur geprüftes Feuerwerk (CE-Zeichen) kaufen und Abstand halten. Notruf 112."], "ar": ["ليلة رأس السنة", "آخر يوم في السنة. تُباع الألعاب النارية فقط من 29 إلى 31 كانون الأول، ويُسمح بإشعالها فقط ليلة رأس السنة ويوم رأس السنة. اشترِ فقط ألعاباً نارية مرخصة (علامة CE) وحافظ على المسافة. الطوارئ 112."], "en": ["New Year's Eve (Silvester)", "The last day of the year. Fireworks are only sold from 29 to 31 December and may only be set off on 31 December and 1 January. Only buy tested fireworks (CE mark) and keep your distance. Emergency 112."], "fr": ["Saint-Sylvestre", "Le dernier jour de l'année. Les feux d'artifice ne sont vendus que du 29 au 31 décembre et ne peuvent être tirés que le 31 décembre et le 1er janvier. N'achetez que des feux contrôlés (marquage CE) et gardez vos distances. Urgence 112."], "ku": ["Şeva Sersalê (Silvester)", "Roja dawî ya salê. Fîşek tenê ji 29 heta 31ê Kanûnê tên firotin û tenê di 31ê Kanûnê û 1ê Çileyê de dikarin bên teqandin. Tenê fîşekên kontrolkirî (nîşana CE) bikire û dûr bisekine. Acîl 112."], "tr": ["Yılbaşı Gecesi (Silvester)", "Yılın son günü. Havai fişek sadece 29–31 Aralık arasında satılır ve sadece 31 Aralık ile 1 Ocak'ta atılabilir. Sadece kontrollü (CE işaretli) havai fişek alın, mesafe bırakın. Acil 112."], "sq": ["Nata e Vitit të Ri (Silvester)", "Dita e fundit e vitit. Fishekzjarret shiten vetëm nga 29 deri më 31 dhjetor dhe mund të hidhen vetëm më 31 dhjetor dhe 1 janar. Blini vetëm fishekzjarre të kontrolluara (shenja CE) dhe mbani distancë. Urgjenca 112."], "ru": ["Новогодняя ночь (Сильвестр)", "Последний день года. Фейерверки продаются только с 29 по 31 декабря, запускать их можно только 31 декабря и 1 января. Покупайте только сертифицированные фейерверки (знак CE) и держите дистанцию. Экстренный номер 112."], "fa": ["شب سال نو (زیلوستر)", "آخرین روز سال. آتش‌بازی فقط از ۲۹ تا ۳۱ دسامبر فروخته می‌شود و فقط در ۳۱ دسامبر و ۱ ژانویه مجاز است. فقط آتش‌بازی دارای علامت CE بخرید و فاصله را رعایت کنید. اورژانس ۱۱۲."], "zh": ["除夕（Silvester）", "一年的最后一天。烟花只在12月29日至31日出售，只允许在12月31日和1月1日燃放。只购买经过检验的烟花（CE标志），保持距离。急救电话112。"]}}, {"id": "neujahr-2027", "kind": "day", "free": null, "emoji": "🥂", "ranges": [["2027-01-01", "2027-01-01"]], "place": null, "t": {"de": ["Neujahr", "Gesetzlicher Feiertag. Geschäfte und Ämter sind geschlossen. Frohes neues Jahr!"], "ar": ["رأس السنة الميلادية", "عطلة رسمية. المتاجر والدوائر مغلقة. سنة جديدة سعيدة!"], "en": ["New Year's Day", "Public holiday. Shops and offices are closed. Happy New Year!"], "fr": ["Jour de l'An", "Jour férié. Magasins et administrations sont fermés. Bonne année !"], "ku": ["Sersal", "Betlaneya fermî. Dikan û dezgeh girtî ne. Sersala te pîroz be!"], "tr": ["Yılbaşı", "Resmi tatil. Dükkânlar ve resmi daireler kapalı. Mutlu yıllar!"], "sq": ["Viti i Ri", "Festë zyrtare. Dyqanet dhe zyrat janë të mbyllura. Gëzuar Vitin e Ri!"], "ru": ["Новый год", "Официальный праздник. Магазины и учреждения закрыты. С Новым годом!"], "fa": ["سال نو میلادی", "تعطیل رسمی. مغازه‌ها و ادارات بسته‌اند. سال نو مبارک!"], "zh": ["元旦", "法定节假日。商店和政府机关关闭。新年快乐！"]}}, {"id": "dreikoenige-2027", "kind": "day", "free": null, "emoji": "👑", "ranges": [["2027-01-06", "2027-01-06"]], "place": null, "t": {"de": ["Heilige Drei Könige", "Christliches Fest. In NRW kein Feiertag, Geschäfte sind offen. Kinder gehen als Sternsinger von Tür zu Tür und sammeln Spenden für Kinder in Not."], "ar": ["عيد الملوك الثلاثة (الغطاس)", "عيد مسيحي. ليس عطلة في ولاية شمال الراين-وستفاليا والمتاجر مفتوحة. أطفال «مغنّو النجمة» يطرقون الأبواب ويجمعون التبرعات للأطفال المحتاجين."], "en": ["Epiphany (Three Kings)", "Christian feast. Not a holiday in NRW, shops are open. Children as star singers go from door to door collecting donations for children in need."], "fr": ["Épiphanie (Rois mages)", "Fête chrétienne. Pas férié en NRW, les magasins sont ouverts. Des enfants « chanteurs à l'étoile » passent de porte en porte et collectent des dons pour les enfants dans le besoin."], "ku": ["Sê Padîşahên Pîroz", "Cejneke xiristiyanan. Li NRW ne betlane ye, dikan vekirî ne. Zarok wek stranbêjên stêrkê derî bi derî digerin û ji bo zarokên hewcedar bexşîşan berhev dikin."], "tr": ["Üç Kral Yortusu", "Hristiyan bayramı. NRW'de tatil değil, dükkânlar açık. Çocuklar yıldız şarkıcıları olarak kapı kapı dolaşıp ihtiyaç sahibi çocuklar için bağış toplar."], "sq": ["Tre Mbretërit", "Festë e مسیحیان ارتدکس، مثلاً از روسیه، صربستان، گرجستان، اریتره یا اتیوپی، امروز کریسمس را جشن می‌گیرند."], "zh": ["东正教圣诞节", "许多东正教基督徒，例如来自俄罗斯、塞尔维亚、格鲁吉亚、厄立特里亚或埃塞俄比亚的人，今天庆祝圣诞节。"]}}, {"id": "orange-day-2026", "kind": "day", "free": null, "emoji": "🧡", "ranges": [["2026-11-25", "2026-11-25"]], "place": null, "t": {"de": ["Orange Day – gegen Gewalt an Frauen", "Internationaler Tag gegen Gewalt an Frauen. Gebäude leuchten orange. Hilfe für Frauen: Hilfetelefon 116 016 – kostenlos, anonym, Tag und Nacht, in vielen Sprachen. Im Notfall 110."], "ar": ["اليوم البرتقالي – ضد العنف ضد المرأة", "اليوم الدولي للقضاء على العنف ضد المرأة. تُضاء المباني باللون البرتقالي. مساعدة للنساء: خط المساعدة 116 016 – مجاني، بدون ذكر الاسم، ليلاً ونهاراً، بلغات كثيرة. في الطوارئ 110."], "en": ["Orange Day – against violence against women", "International Day for the Elimination of Violence against Women. Buildings are lit orange. Help for women: helpline 116 016 – free, anonymous, day and night, in many languages. Emergency 110."], "fr": ["Orange Day – contre les violences faites aux femmes", "Journée internationale pour l'élimination de la violence à l'égard des femmes. Des bâtiments s'illuminent en orange. Aide pour les femmes : ligne 116 016 – gratuite, anonyme, jour et nuit, en plusieurs langues. Urgence 110."], "ku": ["Roja Porteqalî – li dijî tundiya li ser jinan", "Roja Navneteweyî ya li dijî tundiya li ser jinan. Avahî bi rengê porteqalî ronî dibin. Alîkarî ji bo jinan: xeta alîkariyê 116 016 – belaş, bênav, şev û roj, bi gelek zimanan. Acîl 110."], "tr": ["Turuncu Gün – kadına yönelik şiddete karşı", "Kadına Yönelik Şiddete Karşı Uluslararası Mücadele Günü. Binalar turuncu ışıkla aydınlatılır. Kadınlar için yardım hattı 116 016 – ücretsiz, isimsiz, gece gündüz, birçok dilde. Acil durumda 110."], "sq": ["Dita Portokalli – kundër dhunës ndaj grave", "Dita Ndërkombëtare për Eliminimin e Dhunës ndaj Grave. Ndërtesat ndriçohen në portokalli. Ndihmë për gratë: linja 116 016 – falas, anonime, ditë const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Today's date in Marl (Europe/Berlin), as YYYY-MM-DD.
const TODAY=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin'}).format(new Date());
const lastEnd=it=>it.ranges.map(r=>r[1]).sort().pop();
const firstStart=it=>it.ranges.map(r=>r[0]).sort()[0];
const upcoming=()=>D.items.filter(it=>lastEnd(it)>=TODAY).sort((a,b)=>firstStart(a)<firstStart(b)?-1:1);
const isNow=it=>it.ranges.some(([a,b])=>a<=TODAY&&TODAY<=b);
let CUR='',QUEUE=[],SHOWN=[];
function setBtn(on){const B=D.base[CUR]||D.base.en;$('listenLbl').textContent=on?B.stop:B.listen}
function mark(id){document.querySelectorAll('.item').forEach(e=>e.classList.toggle('playing',e.dataset.id===id))}
function stopAudio(){QUEUE=[];const a=$('player');a.pause();a.removeAttribute('src');if(window.speechSynthesis)speechSynthesis.cancel();mark('');setBtn(false)}
function speakText(it){const T=it.t[CUR];return [T[0],D.labels[it.id][CUR],it.place,T[1]].filter(Boolean).join('. ')}
function next(){
  const key=QUEUE.shift();if(key===undefined){mark('');setBtn(false);return}
  mark(key==='_intro'?'':key);
  const file=CUR+'-'+(key==='_intro'?'intro':key);
  if(D.audio.includes(file)){const a=$('player');a.src='audio/'+file+'.mp3';a.play().catch(()=>next());return}
  if(window.speechSynthesis){const U=D.ui[CUR];const it=D.items.find(i=>i.id===key);
    const u=new SpeechSynthesisUtterance(key==='_intro'?U.title+'. '+U.intro:speakText(it));u.lang=CUR;u.onend=next;speechSynthesis.speak(u)}
  else next();
}
$('player').onended=next;
D.order.forEach(([c,name])=>{const b=document.createElement('button');b.className='lang';b.textContent=name;b.lang=c;b.setAttribute('role','listitem');b.onclick=()=>{location.hash=c};$('langGrid').appendChild(b)});
function show(c){
  CUR=c;const U=D.ui[c],B=D.base[c],dir=(D.order.find(o=>o[0]===c)||[])[2]||'ltr';
  document.documentElement.lang=c;document.documentElement.dir=dir;document.title=U.title;
  $('vTitle').textContent=U.title;$('vIntro').textContent=U.intro;$('changeLbl').textContent=B.change;
  SHOWN=upcoming();
  $('list').innerHTML=SHOWN.length?SHOWN.map(it=>{const T=it.t[c];const tags=[it.kind==='event'?U.event:U.day];
    const tg=tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')+(it.free?`<span class="tag free">${esc(U.free)}</span>`:'')+(isNow(it)?`<span class="tag now">${esc(firstStart(it)===lastEnd(it)?U.today:U.now)}</span>`:'');
    return `<article class="item ${it.kind}" data-id="${esc(it.id)}"><h2><span aria-hidden="true">${esc(it.emoji)}</span><span>${esc(T[0])}</span></h2>
    <div class="when">📅 ${esc(D.labels[it.id][c])}</div>${it.place?`<div class="where">📍 ${esc(it.place)}</div>`:''}<p>${esc(T[1])}</p><div class="tags">${tg}</div></article>`}).join('')
    :`<div class="none">${esc(U.none)}</div>`;
  setBtn(false);$('picker').classList.add('hidden');$('view').classList.remove('hidden');scrollTo(0,0);$('listenBtn').focus();
}
function route(){stopAudio();const c=location.hash.slice(1);if(D.ui[c])show(c);else{document.documentElement.dir='ltr';$('view').classList.add('hidden');$('picker').classList.remove('hidden')}}
$('changeBtn').onclick=()=>{location.hash=''};
$('listenBtn').onclick=()=>{if(QUEUE.length||!$('player').paused||(window.speechSynthesis&&speechSynthesis.speaking)){stopAudio();return}
  QUEUE=['_intro',...SHOWN.map(i=>i.id)];setBtn(true);next()};
addEventListener('hashchange',route);
// Stop the voice as soon as the reader leaves this view: any link, back button, tab switch or closing the page.
document.addEventListener('click',e=>{if(e.target.closest('a'))stopAudio()},true);
addEventListener('pagehide',stopAudio);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAudio()});
route();
</script>
